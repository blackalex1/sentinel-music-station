# ==============================================================================
# Sentinel Station — Шаблон конфигурационного файла (config.example.toml)
# Размещается в /data/opt/sentinel-station/config.toml или рядом с бинарником
# ==============================================================================

# URL вашего сервера Sentinel Music Server (без завершающего слэша)
# Например: "https://music.local:8000" или "http://192.168.1.50:8000"
server_url = "http://YOUR_SERVER_HOST:8000"

# Токен авторизации (API токен или зашифрованный сессионный токен enc:v1:...)
auth_token = "ВАШ_ТОКЕН_ЗДЕСЬ"

# Отображаемое имя колонки в приложениях Sentinel Connect (Android, Desktop, Web)
device_name = "Яндекс.Станция (Sentinel)"

# Уникальный ID устройства (если не указан, генерируется автоматически)
device_id = "sentinel-station-speaker"

# Тип устройства для сервера (player / hybrid)
device_type = "player"

# Имя аудиоустройства ALSA на колонке (по умолчанию "default" или "plughw:0,0")
audio_device = "default"

# Начальный уровень громкости при старте (от 0.0 до 1.0)
initial_volume = 0.7

# Включить анализатор спектра FFT (для TUI и LED-экрана часов)
visualizer_enabled = true

# Путь к устройству светодиодного экрана (для Станции Мини 2 с часами)
# Оставьте закомментированным, если колонка без часов или экран не требуется
# led_matrix_path = "/dev/matrix"

# Автоматически восстанавливать связь при обрыве Wi-Fi
auto_reconnect = true

# Интервал отправки пинга (Keep-Alive) в секундах
ping_interval_secs = 15

# Стиль анимации при переключении треков:
# "random" (случайный выбор между стилями при каждом переключении),
# "curtain" (шторка / сканер по 8 вертикальным ребрам),
# "tape" (перемотка бобин кассетника на 1 и 4 цифрах),
# "slot" (вертикальный каскадный барабан D -> G -> A),
# "chevron" (бегущие стрелки >> и <<)
track_animation_style = "random"

# Режим отображения спектрального эквалайзера при воспроизведении:
# "always" (по умолчанию) — спектр отображается постоянно во время проигрывания музыки
# "intro"  — эквалайзер отображается 10 секунд в начале трека, затем возвращаются часы
# "off"    — всегда отображать часы, эквалайзер выключен
equalizer_mode = "always"

# Воспроизводить звуковое приветствие в динамик при старте демона
# false — тихий запуск (рекомендуется), true — объявлять вслух
startup_greeting = false

# Разрешать подключение к серверу с самоподписанным/недоверенным SSL-сертификатом в локальной сети
# false (по умолчанию) — строгая проверка сертификатов (рекомендуется при наличии Let's Encrypt / валидного домена)
# true — разрешить самоподписанные сертификаты (например, при https://192.168.1.x:8000)
allow_insecure_ssl = false
