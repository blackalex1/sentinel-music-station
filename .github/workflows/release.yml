name: Build & Release Sentinel Station

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Создать официальный релиз на GitHub (true/false)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: armv7-unknown-linux-gnueabihf
            zig_target: armv7-unknown-linux-gnueabihf.2.17
            arch_name: armv7
            desc: "Яндекс.Станция (Мини 1/2, Лайт, Станция 2), Raspberry Pi 32-bit"

          - target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.17
            arch_name: aarch64
            desc: "64-битные ARM устройства (Raspberry Pi 4/5, Orange Pi, Linux SBC)"

          - target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.17
            arch_name: x86_64
            desc: "Linux x86_64 (ПК, сервер, ноутбук)"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Install ALSA dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Binary (${{ matrix.target }})
        run: |
          chmod +x scripts/fake-pkg-config.sh
          export PKG_CONFIG="$(pwd)/scripts/fake-pkg-config.sh"
          export PKG_CONFIG_ALLOW_CROSS=1
          cargo zigbuild --target ${{ matrix.zig_target }} --release

      - name: Package Release Archive (${{ matrix.target }})
        run: |
          PKG_DIR="sentinel-station-${{ matrix.target }}"
          mkdir -p "$PKG_DIR/bin" "$PKG_DIR/scripts"

          cp "target/${{ matrix.target }}/release/sentinel-station" "$PKG_DIR/bin/"
          chmod +x "$PKG_DIR/bin/sentinel-station"

          cp config.example.toml "$PKG_DIR/"
          cp scripts/install.sh "$PKG_DIR/"
          chmod +x "$PKG_DIR/install.sh"

          cp scripts/S99sentinel-station "$PKG_DIR/scripts/"
          cp scripts/sentinel-station.service "$PKG_DIR/scripts/"
          cp README.md "$PKG_DIR/"

          tar -czvf "${PKG_DIR}.tar.gz" "$PKG_DIR"
          sha256sum "${PKG_DIR}.tar.gz" > "${PKG_DIR}.tar.gz.sha256"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-station-${{ matrix.target }}
          path: |
            sentinel-station-${{ matrix.target }}.tar.gz
            sentinel-station-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-artifacts
        run: |
          ls -lah
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/*.sha256
            release-artifacts/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
